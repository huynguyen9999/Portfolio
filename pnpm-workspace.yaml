allowBuilds:
  unrs-resolver: true

# This plugin only calls globSync(pattern, { onlyDirectories: true }).
# The pinned patch preserves fast-glob's non-recursive literal-root behavior.
overrides:
  '@next/eslint-plugin-next@16.4.0>fast-glob': npm:tinyglobby@0.2.17

patchedDependencies:
  '@next/eslint-plugin-next@16.4.0': patches/@next__eslint-plugin-next@16.4.0.patch
